name: "WWA Wing Test"

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
      - uses: ./.github/actions/init
        with:
          lfs: true
      - name: "Build"
        run: |
          npm run build
      - name: "test"
        run: |
          npm test
