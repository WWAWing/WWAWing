name: "WWA Wing Publish"

permissions:
  id-token: write  # Required for OIDC
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョンを入力 (patch/minor/major/X.Y.Z-hogehoge.based-on.A.B.C.p.N)"
        required: true
        default: "patch"
      tag:
        description: "publish に使うタグを入力 (不安定版: unstable, 安定版: latest, 超不安定版はバージョン名の hogehoge の部分に合わせる)"
        required: true
        default: "unstable"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
      - uses: ./.github/actions/init
        with:
          lfs: true
      - name: "Publish"
        run: |
          pnpm run version-up ${{ github.event.inputs.version }} --yes
          export NEW_VERSION=$(node -e 'process.stdout.write(require("./packages/engine/package.json").version)')
          pnpm install --frozen-lockfile
          git add -u pnpm-lock.yaml packages/*/package.json
          git commit -m "v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push origin HEAD --tags
          pnpm run publish:all --tag ${{ github.event.inputs.tag }}
